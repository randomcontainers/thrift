name: thrift
title: Apache Thrift compiler
summary: Generates C++, Java, Python, Go, Rust, C#, JavaScript and other code from Thrift IDL files, and checks a changed IDL file for breaking changes.
homepage: https://thrift.apache.org/
# Only the compiler is built. The SHA-256 code in sha256.h is public domain
# and adds no term. The parser and scanner are generated by the distro's
# Bison and flex. The Bison exception lets the parser be used under any
# terms, and flex output carries no license terms.
license: Apache-2.0
upstream:
  source: github-release
  repository: apache/thrift
  # Release tags look like v0.25.0. The Go module tags (lib/go/thrift/...)
  # and the old 0.9.3.1 release do not match. The GitHub releases carry no
  # source tarball; it comes from the Apache distribution site, which keeps
  # the two newest releases.
  tag-pattern: '^v(\d+\.\d+\.\d+)$'
  version-template: '{1}'
  versioning: semver
  version: 0.25.0
  artifact:
    url: https://dlcdn.apache.org/thrift/{version}/thrift-{version}.tar.gz
    checksums:
      url: https://downloads.apache.org/thrift/{version}/thrift-{version}.tar.gz.sha256
      algorithm: sha256
    signature: https://downloads.apache.org/thrift/{version}/thrift-{version}.tar.gz.asc
    sha256: 66da4707214c54c94bac082103dc67adaf9e08925662700f269170a7b534b214
image:
  entrypoint: [thrift]
  cmd: [--version]
test:
  - |
    thrift --version > version.txt
    printf 'Thrift version %s\n' "$VERSION" > version.expected
    if ! cmp -s version.expected version.txt; then
      echo "expected 'Thrift version $VERSION', got '$(cat version.txt)'" >&2
      exit 1
    fi
    path=$(command -v thrift)
    if [ "$path" != /usr/local/bin/thrift ]; then
      echo "thrift is $path, not /usr/local/bin/thrift" >&2
      exit 1
    fi
  - |
    cat > common.thrift <<'EOF'
    namespace cpp demo.common
    namespace java demo.common
    namespace netstd Demo.Common

    struct Status {
      1: i32 code
      2: string detail
    }

    service HealthService {
      Status check()
    }
    EOF
    cat > inventory.thrift <<'EOF'
    include "common.thrift"

    namespace cpp demo.inventory
    namespace java demo.inventory
    namespace netstd Demo.Inventory

    typedef i64 ItemId

    const i32 MAX_BATCH = 100
    const map<string, string> LABELS = {"env": "test", "team": "storage"}

    enum Category {
      FOOD = 1,
      TOOLS = 2,
      BOOKS = 3
    }

    /** An item in stock. */
    struct Item {
      1: required ItemId id
      2: required string name
      3: optional Category category
      4: i32 count = 0
      5: list<string> tags
    }

    exception NotFound {
      1: ItemId id
      2: string reason
    }

    service Inventory extends common.HealthService {
      /** Returns the item with the given id. */
      Item lookup(1: ItemId id) throws (1: NotFound missing)
      void store(1: Item item)
      oneway void reload()
    }
    EOF
    # -r also generates code for the included common.thrift. The Rust
    # generator writes into the output directory itself, not into gen-rs.
    thrift -r --gen cpp --gen py --gen java --gen go --gen rs --gen netstd --gen js:node --gen rb \
      --gen html --gen json inventory.thrift
    for f in gen-cpp/Inventory.h gen-cpp/inventory_types.h gen-cpp/HealthService.h \
             gen-py/inventory/Inventory.py gen-py/inventory/ttypes.py gen-py/common/HealthService.py \
             gen-java/demo/inventory/Inventory.java gen-java/demo/inventory/Item.java \
             gen-java/demo/common/HealthService.java gen-go/inventory/inventory.go \
             gen-go/inventory/inventory-remote/inventory-remote.go inventory.rs common.rs \
             gen-html/index.html gen-json/inventory.json; do
      if [ ! -s "$f" ]; then
        echo "thrift did not write $f; it wrote:" >&2
        find . \( -path './gen-*' -o -name '*.rs' \) -type f >&2
        exit 1
      fi
    done
    for d in gen-netstd gen-nodejs gen-rb; do
      if [ -z "$(find "$d" -type f)" ]; then
        echo "thrift wrote no files in $d" >&2
        exit 1
      fi
    done
    if ! grep -Fq "Autogenerated by Thrift Compiler ($VERSION)" gen-cpp/Inventory.h; then
      echo "gen-cpp/Inventory.h does not name compiler version $VERSION:" >&2
      head -n 5 gen-cpp/Inventory.h >&2
      exit 1
    fi
    if ! grep -Fqx 'MAX_BATCH = 100' gen-py/inventory/constants.py; then
      echo 'gen-py/inventory/constants.py does not define MAX_BATCH = 100:' >&2
      cat gen-py/inventory/constants.py >&2
      exit 1
    fi
  - |
    # Runs every generator that thrift --help lists on inventory.thrift from
    # the previous test. Generators come and go between releases, so the list
    # is read from the binary.
    thrift --help > help.txt 2>&1 || true
    sed -n 's/^  \([a-z0-9_]*\) (.*):$/\1/p' help.txt > generators.txt
    n=$(wc -l < generators.txt | tr -d ' ')
    if [ "$n" -lt 25 ]; then
      echo "thrift --help lists $n generators:" >&2
      cat help.txt >&2
      exit 1
    fi
    while read -r g; do
      mkdir "out-$g"
      if ! thrift -out "out-$g" --gen "$g" inventory.thrift > "out-$g.log" 2>&1; then
        echo "--gen $g failed:" >&2
        cat "out-$g.log" >&2
        exit 1
      fi
      if [ -z "$(find "out-$g" -type f)" ]; then
        echo "--gen $g wrote no files" >&2
        exit 1
      fi
    done < generators.txt
  - |
    printf '%s\n' 'struct Order {' '  1: required i64 id' '  2: required string customer' '}' > old.thrift
    printf '%s\n' 'struct Order {' '  1: required i64 id' '  2: required string customer' \
      '  3: optional string note' '}' > compatible.thrift
    printf '%s\n' 'struct Order {' '  1: required i64 id' '}' > breaking.thrift
    if ! thrift --audit old.thrift compatible.thrift > audit-ok.log 2>&1; then
      echo 'adding an optional field failed the audit:' >&2
      cat audit-ok.log >&2
      exit 1
    fi
    status=0
    thrift --audit old.thrift breaking.thrift > audit-fail.log 2>&1 || status=$?
    if [ "$status" -ne 2 ]; then
      echo "removing a required field: expected exit status 2, got $status" >&2
      cat audit-fail.log >&2
      exit 1
    fi
    if ! grep -Fq 'Struct Field removed for Id = 2 in Order' audit-fail.log; then
      echo 'the audit does not report the removed field:' >&2
      cat audit-fail.log >&2
      exit 1
    fi
  - |
    printf '%s\n' 'struct Broken {' '  1: i32 a' '  2 string b' '}' > broken.thrift
    status=0
    thrift --gen py broken.thrift > broken.log 2>&1 || status=$?
    if [ "$status" -eq 0 ]; then
      echo 'thrift accepted a field without a colon after its id' >&2
      exit 1
    fi
    if ! grep -Fq 'broken.thrift:3]' broken.log; then
      echo 'the error does not point to line 3 of broken.thrift:' >&2
      cat broken.log >&2
      exit 1
    fi
    # An unterminated comment at the end of a file made thrift loop forever
    # until 0.25.0 (THRIFT-6212).
    printf '%s\n' 'struct A {' '  1: i32 x' '}' '/* not closed' > eof.thrift
    status=0
    timeout 60 thrift --gen py eof.thrift > eof.log 2>&1 || status=$?
    if [ "$status" -ne 1 ]; then
      echo "unterminated comment: expected exit status 1, got $status" >&2
      cat eof.log >&2
      exit 1
    fi
    if ! grep -Fq 'Unexpected end of file in multiline comment' eof.log; then
      echo 'the error does not mention the unterminated comment:' >&2
      cat eof.log >&2
      exit 1
    fi
examples:
  - title: Generate Python and Go code for api.thrift and the files it includes
    command: docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/work" ghcr.io/randomcontainers/thrift -r --gen py --gen go api.thrift
  - title: Write the generated Java classes into an existing directory
    command: mkdir -p src/gen && docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/work" ghcr.io/randomcontainers/thrift -out src/gen --gen java api.thrift
  - title: Check api.thrift, which includes common.thrift, against the main branch for breaking changes
    command: mkdir -p old && git archive origin/main api.thrift common.thrift | tar -xf - -C old && docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/work" ghcr.io/randomcontainers/thrift --audit old/api.thrift api.thrift
